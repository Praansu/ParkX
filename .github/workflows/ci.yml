name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio httpx

      - name: Auto-fix lint with ruff (safe fixes, ignore remaining)
        run: ruff check --fix parking_backend/ tests/ backend.py || true

      - name: Auto-format with ruff
        run: ruff format parking_backend/ tests/ backend.py

      - name: Verify no lint errors remain (ignore non-fixable RUF013, BLE001, F841)
        run: ruff check parking_backend/ tests/ backend.py --ignore=RUF013,BLE001,F841

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Check imports resolve
        run: |
          python -c "from parking_backend.main import app; from parking_backend.blynk import BlynkClient; from parking_backend.ai import chat; print('All imports OK')"

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t parkx .

      - name: Test Docker image starts
        run: |
          docker run -d --name test-container -p 8000:8000 parkx
          sleep 15
          curl -f http://localhost:8000/health || (docker logs test-container && exit 1)
          docker stop test-container